<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />

    <title>Parrot Party Clicker</title>
    <link href="/styles/styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1 id="counter">Clicks: 0</h1>

      <img 
      id="parrot"
      src="https://cultofthepartyparrot.com/parrots/hd/parrot.gif"
      alt="Dancing party parrot"
      />
      
        <button id="reset">reset</button>

        <script>
         "use strict";

        let clickCount = 0;

        const counter = document.querySelector("#counter");
        const parrot = document.querySelector("#parrot");
        const resetButton = document.querySelector("#reset");

          parrot.addEventListener("click", () => {
        clickCount += 1;
        counter.textContent = `Clicks: ${clickCount}`;

        if (clickCount === 10) {
          parrot.style.transform = "scale(1.5)";
          counter.textContent = `Clicks: ${clickCount} 🎉`;
        }
      });

    resetButton.addEventListener("click", () => {
        clickCount = 0;
        counter.textContent = `Clicks: ${clickCount}`;
        parrot.style.transform = "scale(1)";
      });

      resetButton.addEventListener("click", () => {
        clickCount = 0;
        counter.textContent = `Clicks: ${clickCount}`;
        parrot.style.transform = "scale(1)";
      });
    </script>
  </body>
</html>
